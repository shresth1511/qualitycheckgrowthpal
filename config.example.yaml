elasticsearch:
  host: "${ELASTIC_HOST}" # e.g. https://your-elastic-host:9200
  index: "sellers_search"
  username: "${ELASTIC_USERNAME}"
  password: "${ELASTIC_PASSWORD}"
  verify_certs: false
  page_size: 2000
  fields:
    - companyId
    - linkedinKey
    - city
    - country
    - region
    - state
    - empCount
    - isAcquired
    - predictedRevenueRange.min
    - predictedRevenueRange.max
    - websiteStatus.isActive
    - websiteStatus.scrapeStatus
    - websiteStatus.statusCode
    - children.isDuplicate
    - parent.isDuplicate

s3:
  bucket: "${S3_BUCKET}"
  key: "${S3_KEY}" # e.g. exports/companies.jsonl
  region: "${AWS_REGION}"

milvus:
  uri: "${MILVUS_URI}" # e.g. http://milvus-host:19530
  token: "${MILVUS_TOKEN}"
  collection: "${MILVUS_COLLECTION}"
  output_fields:
    - companyId
    - linkedinKey
    - city
    - country
    - empCount
    - isAcquired

output_dir: "output"
primary_key: "companyId"
key_fields:
  - linkedinKey
  - city
  - country
  - empCount
  - isAcquired
required_fields:
  - companyId
  - linkedinKey
  - city
  - country
  - empCount
  - websiteStatus.isActive
identity_group_fields:
  - linkedinKey
  - website
weights:
  completeness: 0.4
  consistency: 0.35
  accuracy: 0.25
